{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Telepathy — Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#07070f;--card:rgba(255,255,255,0.04);--card-border:rgba(255,255,255,0.08);
            --cyan:#00e5ff;--purple:#a855f7;--magenta:#ec4899;--green:#22c55e;--red:#ef4444;--orange:#f97316;
            --text:#e2e8f0;--text-dim:#64748b;--glow:0 0 60px rgba(0,229,255,0.12);
        }
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
            min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;position:relative;overflow-x:hidden}
        .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.25;pointer-events:none;animation:float 20s ease-in-out infinite}
        .orb-1{width:400px;height:400px;background:var(--cyan);top:-5%;right:-5%}
        .orb-2{width:300px;height:300px;background:var(--purple);bottom:10%;left:-5%;animation-delay:-10s}
        @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}

        .dashboard{position:relative;z-index:1;max-width:480px;width:100%;animation:fade-up .7s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
        @keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

        .welcome-card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:2rem;
            backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);box-shadow:var(--glow);text-align:center;margin-bottom:1rem}
        .avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--cyan),var(--purple));
            display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 1rem;
            box-shadow:0 0 30px rgba(0,229,255,0.3)}
        .welcome-card h1{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem}
        .welcome-card p{font-size:0.85rem;color:var(--text-dim)}
        .name-input{margin-top:1rem;width:100%;padding:0.7rem 1rem;background:rgba(255,255,255,0.05);
            border:1px solid var(--card-border);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;
            font-size:0.9rem;text-align:center}
        .name-input:focus{outline:none;border-color:var(--cyan)}

        .actions{display:flex;flex-direction:column;gap:0.75rem}
        .action-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:1.25rem 1.5rem;
            backdrop-filter:blur(40px);display:flex;align-items:center;gap:1rem;cursor:pointer;transition:all .25s}
        .action-card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 0 25px rgba(0,229,255,0.1)}
        .action-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
        .action-icon.create{background:linear-gradient(135deg,var(--cyan),#06b6d4)}
        .action-icon.join{background:linear-gradient(135deg,var(--purple),var(--magenta))}
        .action-info h3{font-size:0.95rem;font-weight:600;margin-bottom:0.15rem}
        .action-info p{font-size:0.78rem;color:var(--text-dim)}

        /* Join card — has a PIN input */
        .join-section{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:1.5rem;
            backdrop-filter:blur(40px);display:none;animation:slide-down .3s ease}
        .join-section.show{display:block}
        @keyframes slide-down{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
        .pin-input-row{display:flex;gap:0.5rem;margin-bottom:0.75rem}
        .pin-input{flex:1;padding:0.8rem 1rem;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);
            border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.4rem;text-align:center;
            letter-spacing:0.5em;transition:border-color .2s}
        .pin-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,0.15)}
        .btn{padding:0.7rem 1.2rem;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:0.85rem;
            font-weight:600;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:0.4rem}
        .btn-primary{background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff;width:100%;justify-content:center}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 20px rgba(168,85,247,0.3)}
        .join-status{font-size:0.8rem;margin-top:0.5rem;text-align:center}
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="dashboard">
        <!-- Welcome -->
        <div class="welcome-card">
            <div class="avatar">👤</div>
            <h1>Start a chat</h1>
            <p>No account, no login. Pick a display name for this chat only — it's not saved anywhere else.</p>
            <input type="text" class="name-input" id="display-name-input" maxlength="32" placeholder="Display name (optional)" />
        </div>

        <!-- Actions -->
        <div class="actions">
            <div class="action-card" onclick="createChat()">
                <div class="action-icon create">💬</div>
                <div class="action-info">
                    <h3>Create Chat</h3>
                    <p>Generate a 4-digit PIN and share it with your partner</p>
                </div>
            </div>

            <div class="action-card" id="join-toggle" onclick="toggleJoin()">
                <div class="action-icon join">🔗</div>
                <div class="action-info">
                    <h3>Join Chat</h3>
                    <p>Enter a 4-digit PIN to join an existing chat room</p>
                </div>
            </div>

            <!-- Expandable join section -->
            <div class="join-section" id="join-section">
                <div class="pin-input-row">
                    <input type="text" class="pin-input" id="pin-input" maxlength="4" placeholder="0000" inputmode="numeric" />
                </div>
                <button class="btn btn-primary" onclick="joinChatByPin()">Join Chat Room</button>
                <p class="join-status" id="join-status"></p>
            </div>
        </div>
    </div>

<script>
    function toggleJoin() {
        document.getElementById('join-section').classList.toggle('show');
        const inp = document.getElementById('pin-input');
        if (inp) setTimeout(() => inp.focus(), 100);
    }

    function getDisplayName() {
        return document.getElementById('display-name-input').value.trim();
    }

    // Key generation and the actual create-chat/join-chat API call both
    // happen in chatbox.html -- this page only collects what's needed
    // (display name, and a PIN for joining) and hands off via query params,
    // so there's one single place that generates a chat's keys instead of
    // duplicating that logic here too.
    function createChat() {
        const name = encodeURIComponent(getDisplayName());
        window.location.href = `/chat/chatbox/?action=create&display_name=${name}`;
    }

    function joinChatByPin() {
        const pin = document.getElementById('pin-input').value.trim();
        const st = document.getElementById('join-status');
        if (!/^\d{4}$/.test(pin)) { st.style.color = 'var(--red)'; st.textContent = 'Enter a valid 4-digit PIN.'; return; }
        const name = encodeURIComponent(getDisplayName());
        window.location.href = `/chat/chatbox/?action=join&chat_id=${pin}&display_name=${name}`;
    }
</script>
</body>
</html>
